# Codex CLI configuration — reference copy.
#
# Live path: ~/.codex/config.toml (WSL Ubuntu). Codex reads that fixed
# location, so this file is NOT sourced directly — copy it into place on a
# new machine, then re-add machine-specific bits (see Sanitized below).
#
# Sanitized: the [projects."/path"] trust_level entries are stripped. They
# grant Codex trusted execution on specific local paths and are per-machine,
# same reasoning the README applies to ssh/config.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approvals_reviewer = "auto_review"

# Status line segments, rendered left to right in the TUI.
[tui]
status_line = [
    "model-with-reasoning",
    "run-state",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
    "git-branch",
    "task-progress",
]

[features]
terminal_resize_reflow = true
memories = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."build-web-data-visualization@openai-curated"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true
